<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Lista de Tareas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="contenedor">
    <h1>Mi Lista de Tareas</h1>

    <div class="formulario">
      <input type="text" id="tareaInput" placeholder="Escribe una tarea">

      <select id="prioridadInput">
        <option value="baja">Baja</option>
        <option value="media">Media</option>
        <option value="alta">Alta</option>
      </select>

      <input type="date" id="fechaInput">

      <button onclick="agregarTarea()">Agregar</button>
    </div>
    <div id="contadorTareas" class="contador-tareas">
  Pendientes: 0 | Completadas: 0 | Total: 0
</div>
<div class="filtros">
  <button id="filtro-todas" class="activo" onclick="cambiarFiltro('todas')">Todas</button>
  <button id="filtro-pendientes" onclick="cambiarFiltro('pendientes')">Pendientes</button>
  <button id="filtro-completadas" onclick="cambiarFiltro('completadas')">Completadas</button>
  <button id="filtro-alta" onclick="cambiarFiltro('alta')">Alta</button>
  <button id="filtro-media" onclick="cambiarFiltro('media')">Media</button>
  <button id="filtro-baja" onclick="cambiarFiltro('baja')">Baja</button>
</div>
    <ul id="listaTareas"></ul>
  </div>

  <script src="script.js"></script>
</body>
</html>
